# The desktop app's Rust: the runner connection and the GPUI app, built
# together with one lock file and one target folder.
[workspace]
resolver = "2"
members = ["client", "core", "gpui", "dock", "dock/layout", "web"]
# A copy of a published crate, built as a dependency only (below).
exclude = ["vendor"]

# gpui-kit's components, as published at 0.9.0, with this app's changes on
# top: its popup menus drawn as macOS draws its own (the tick column beside
# the icon, the metrics, the highlight), which nothing outside the crate can
# reach (Mike, 12 Nov: the Inbox's sort menu "not spaced properly", and no
# tick). `git log -p desktop/vendor` shows what's ours: the first commit
# there is the crate as published. On a gpui-kit bump, copy the new version
# in from ~/.cargo/registry/src and put those changes back on it.
#
# gpui-kit's base, the same way: the first commit under vendor/gpui-base is
# 0.9.0 as published. Ours on top: a TextViewStyle switch for the hairline
# the kit draws under every link, which Swift's replies don't have (Mike,
# 12 Nov: "the links are underlined in the GPUI version"). And a selection
# takes in a soft-wrapped row's first character, which GPUI places at the end
# of the row above (`wrapped_row_starts`, `drawn_position`; Mike, 13 Nov:
# "can't select all the way to the start of the line"). And a test
# snapshot's `visible_bounds`, what's drawn of an element inside its clips,
# so scripted clicks land on it rather than its whole middle, which for one
# scrolled half out of a pane is over its neighbour (13 Nov).
# And links in a SelectableText (`links`), drawn in a colour and followed on a
# click that isn't a drag, for the web addresses in Mike's bubble (16 Nov).
# And a paste longer than a textarea scrolled to its end: `scroll_to` clamped
# its target with the old text's height and left the box at the top (Mike,
# 17 Nov: a dictated brain dump showed its start, the end cut off).
# And a press whose release a click handler stopped (a PR tab's close) is
# ended by the next press, not taken for a drag still going on: the link
# clicked next did nothing until clicked again (Mike, 19 Nov;
# `released_unseen` in text_selection.rs).
# And a press on a link in text sends a sheen across its words, which Mike
# picked from four mockups (19 Nov; `text/link_glint.rs`).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }
# gpui-pre 0.3.11 as published, with file drags switching out of keyboard
# modality before hover hit tests (window.rs). Otherwise a drop after typing
# reaches no target. Keep this patch when updating the snapshot. Also
# Window::element_opacity made public, for the sidebar's turning arcs
# (gpui/src/spinner.rs).
# And ListState::scroll_px_offset_for_scrollbar reading an anchor past the
# last item (following the tail, before the next layout) as the end of the
# range, not a viewport beyond it: ScrollBounce took that gap for a pull past
# the transcript's bottom and stretched it the wrong way (Ian, 17 Nov).
gpui-pre = { path = "vendor/gpui-pre" }
# gpui-pre-macos 0.3.11 as published, except that with a native view inside
# the window holding the keyboard (a web panel's page), a key without ⌘ or
# Control isn't GPUI's key equivalent: it goes to that view. Otherwise
# Backspace and the arrows went to a GPUI text box out of sight (Mike, 19 Nov,
# the YouTube panel). See another_view_has_the_keyboard in its window.rs.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# Scripted screenshots run in debug apps, often at background priority. An
# unoptimized PNG encode stalled the app for 30 seconds (14 Nov). Optimize
# its filtering and CRC routines; generic encoding still uses the app's
# debug settings, so the fixed filter and worker in automation matter too.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
